<form hx-post="/rota/daynote/save/">
  <div class="modal-head">Note for {{ day|date:"D j M Y" }}</div>
  <input type="hidden" name="day" value="{{ day|date:'Y-m-d' }}">
  <div class="modal-body">
    <div class="field">
      <label for="id_text">Note</label>
      <input name="text" id="id_text" value="{{ note.text|default:'' }}" maxlength="300"
             placeholder="e.g. Flu clinic — extra pressure">
    </div>
  </div>
  <div class="modal-actions">
    <button type="submit" class="btn btn-primary">Save</button>
    <button type="button" class="btn btn-quiet" onclick="document.getElementById('modal').innerHTML=''">Cancel</button>
  </div>
</form>
