<form hx-post="/rota/locum/save/" hx-target="#modal">
  <div class="modal-head">Locum — {{ day|date:"D j M" }} {{ part }}</div>
  {% if warning %}<div class="warn">{{ warning }}</div>{% endif %}
  {% if req %}<input type="hidden" name="pk" value="{{ req.pk }}">{% endif %}
  <input type="hidden" name="day" value="{{ day|date:'Y-m-d' }}">
  <input type="hidden" name="part" value="{{ part }}">
  <div class="modal-body">
    <div class="field">
      <label for="id_session_type_id">Covers</label>
      <select name="session_type_id" id="id_session_type_id">
        {% for t in session_types %}
        <option value="{{ t.id }}" {% if req.session_type_id == t.id %}selected{% endif %}>{{ t.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label for="id_status">Status</label>
      <select name="status" id="id_status">
        {% for value, label in statuses %}
        <option value="{{ value }}" {% if req.status == value %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label for="id_clinician_id">Locum (required to book)</label>
      <select name="clinician_id" id="id_clinician_id"><option value="">—</option>
        {% for l in locums %}
        <option value="{{ l.id }}" {% if req.clinician_id == l.id %}selected{% endif %}>{{ l.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label for="id_covering_id">Covering for</label>
      <select name="covering_id" id="id_covering_id"><option value="">—</option>
        {% for c in coverable %}
        <option value="{{ c.id }}" {% if req.covering_id == c.id %}selected{% endif %}>{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label for="id_details">Details</label>
      <textarea name="details" id="id_details" rows="2">{{ req.details|default:'' }}</textarea>
    </div>
  </div>
  <div class="modal-actions">
    <button type="submit" class="btn btn-primary">Save</button>
    <button type="button" class="btn btn-quiet" onclick="document.getElementById('modal').innerHTML=''">Cancel</button>
  </div>
</form>
