{% extends "base.html" %}
{% block title %}Propose a swap{% endblock %}
{% block content %}
<h1>Propose a swap</h1>
<form method="post">
  {% csrf_token %}
  <div class="field">
    <label for="id_my_entry_id">My session</label>
    <select name="my_entry_id" id="id_my_entry_id">
      {% for e in mine %}
      <option value="{{ e.id }}">{{ e.day|date:"D j M" }} {{ e.part }} — {{ e.session_type.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="field">
    <label for="id_their_entry_id">Colleague's session</label>
    <select name="their_entry_id" id="id_their_entry_id">
      {% for e in theirs %}
      <option value="{{ e.id }}">{{ e.clinician.name }}: {{ e.day|date:"D j M" }} {{ e.part }} — {{ e.session_type.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="field">
    <label for="id_message">Message</label>
    <textarea name="message" id="id_message" rows="2"></textarea>
  </div>
  <p class="field-help">You exchange session types in both sessions, so you must both normally work
  both of the sessions involved. A full duty day swaps as a whole day.</p>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Propose swap</button>
  </div>
</form>
{% endblock %}
