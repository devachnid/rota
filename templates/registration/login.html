{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-wrap">
  <p class="auth-brand">Rota</p>
  <div class="auth-card">
    <h1>Log in</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Log in</button>
    </form>
    <p class="field-help"><a href="{% url 'password_reset' %}">Forgotten your password?</a></p>
  </div>
</div>
{% endblock %}
