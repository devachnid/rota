{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-wrap">
  <p class="auth-brand">Rota</p>
  <div class="auth-card">
    <h1>Log in</h1>
    {% if settings_practice_hr_url %}
    <p><a class="btn btn-primary" href="{% url 'oidc_authentication_init' %}">Sign in with the practice account</a></p>
    <p class="field-help">Or use your rota password below.</p>
    {% endif %}
    <form method="post" id="login-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Log in</button>
    </form>
    <div class="form-actions">
      <button type="button" id="passkey-login" class="btn" style="display:none"
              data-options-url="{% url 'passkey_login_options' %}"
              data-login-url="{% url 'passkey_login' %}"
              data-next="{{ next }}">Sign in with a passkey</button>
    </div>
    <p id="passkey-error" class="field-error" style="display:none" role="alert"></p>
    <p class="field-help"><a href="{% url 'password_reset' %}">Forgotten your password?</a></p>
  </div>
</div>
{% endblock %}
